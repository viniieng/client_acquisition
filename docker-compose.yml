services:
  api:
    build:
      context: .
      dockerfile: backend/src/API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: ${SUPABASE_CONNECTION_STRING}
    ports:
      - "5001:8080"

  frontend:
    build:
      context: .
      dockerfile: frontend/src/Dockerfile
    ports:
      - "8080:8080"

  